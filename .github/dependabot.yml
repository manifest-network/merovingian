# Dependency update proposals only. Every update is a reviewed PR that must pass
# CI, and an updated image still needs its own verified, authorized release.
# The cooldown delays version updates until releases have aged; security
# updates are not delayed or capped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 removes the compiler API used by scripts/check-runtime-image.mjs.
      - dependency-name: typescript
        versions: ['>=7']
      # Node type definitions follow the Node 24 runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    ignore:
      # The runtime stays on the Node 24 line.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Operator-only keyring helper: security updates only. Any bump means a
  # rebuild, a new reviewed helper SHA-256, a govulncheck run and fixture
  # verification (docs/DEPENDENCIES.md).
  - package-ecosystem: gomod
    directory: /tools/keyring-signer
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
